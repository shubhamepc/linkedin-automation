# LinkedIn Automation — settings
# Change anything you like. Safe defaults are already set.

schedule:
  time: "10:30"              # daily start time (24h, your computer's local time)
  start_jitter_minutes: 75   # random 0-75 min delay so it starts at a different time each day
  active_days: [mon, tue, wed, thu, fri, sat]   # sunday off

limits:
  weekly_cap: 80             # max invites in any 7 days (LinkedIn allows ~100/week)
  warmup:                    # [min, max] invites per day in week 1 / week 2
    - [5, 8]
    - [8, 14]
  normal: [12, 22]           # weekdays after the warm-up
  saturday: [3, 7]
  skip_day_chance: 0.07      # sometimes skip a whole day (people take days off too)
  max_profile_visits: 70     # max profile visits per day
  visits_per_invite: 3.5     # visits allowed per invite in the quota
  withdraw_after_days: 21    # withdraw invites pending longer than this
  max_withdraw_per_day: 5
  min_acceptance_rate: 0.20  # below this acceptance rate the daily volume is halved

pacing:
  between_profiles_sec: [40, 140]
  break_every: [5, 9]        # a longer break every 5-9 profiles
  break_minutes: [3, 9]

ai:
  mode: rules                # rules = FREE (keywords + note templates) | claude = AI (paid, best quality)
  model: claude-opus-5-5
  effort: low                # low = cheaper and faster; "medium" for higher quality
  min_score: 70              # 0-100; isse upar wale hi invite honge
  note_max_chars: 280        # Premium limit is 300; keeps a small margin
  note_language: English
  send_without_note_if_note_fails: true

rules:                       # used only in FREE mode (mode: rules)
  # Placeholders: {first_name} {company} {topic} (the matched keyword) {my_name}
  note_templates:
    - "Hi {first_name}, came across your profile and liked what you're doing at {company}. Would be great to connect and follow your work!"
    - "Hi {first_name}, your work at {company} caught my eye. Always good to connect with people in a similar space. Happy to connect!"
    - "Hi {first_name}, I've been connecting with professionals in my field and your profile at {company} stood out. Would love to connect. – {my_name}"
  note_templates_no_company:
    - "Hi {first_name}, came across your profile and liked your background. Would be great to connect and follow your work!"
    - "Hi {first_name}, your profile caught my eye. Always good to connect with people in a similar space. Happy to connect!"

search:
  network: ["S"]             # S = 2nd-degree (best acceptance), O = 3rd+
  pages_per_harvest: 2
  extra_queries: []          # optional: extra search keywords, e.g. ["D2C founder India"]

browser:
  channel: chrome            # uses your installed Google Chrome
  headless: false
